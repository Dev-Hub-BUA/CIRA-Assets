<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIRA Assets — الصفحة غير موجودة</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="assets/fonts.css">
  <script src="./auth-guard.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
      background: #faf8f5;
      color: #1f1c17;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4ddcf;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .code {
      font-family: "IBM Plex Mono", monospace;
      font-size: 54px;
      font-weight: 700;
      color: #703845;
      line-height: 1;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1f1c17;
    }
    p {
      font-size: 14px;
      line-height: 22px;
      color: #5f5a50;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 20px;
      border-radius: 8px;
      border: 0;
      background: #703845;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 8px;
      transition: background 150ms ease;
    }
    .btn:hover {
      background: #5a2c37;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/logo.png" alt="CIRA Education" style="height: 44px; width: auto; margin-bottom: 8px">
    <div class="code">404</div>
    <h1>الصفحة غير موجودة · Page Not Found</h1>
    <p>يبدو أن الرابط المطلوب غير متوفر أو تم نقله. سيتم تحويلك تلقائياً خلال ثوانٍ إلى لوحة التحكم.</p>
    <a href="index.html" class="btn">
      <span>العودة إلى لوحة التحكم</span>
      <span dir="ltr">→</span>
    </a>
  </div>
  <script>
    setTimeout(function() {
      window.location.replace('index.html');
    }, 3500);
  </script>
</body>
</html>
